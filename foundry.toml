[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.24"

[fmt]
line_length = 120

# Base Sepolia — the arena, vault and ERC-8004 registries deploy here (testnet only).
# There is no mainnet endpoint here on purpose: PriceRight is testnet-scoped.
[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
